# The container publishes to 127.0.0.1 only. Nginx on the host terminates TLS and
# proxies to it, so port 3000 is never reachable from the internet.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # Point at the mounted log. Without it the "minutes" objective reports
      # itself unavailable and the API refuses it with a 400; the core distance
      # path is unaffected either way.
      SIMPUL_HISTORY_PATH: /data/customer1-historical.csv
    volumes:
      # Read-only: the service never writes to the log, so it should not be able to.
      - ./data:/data:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
