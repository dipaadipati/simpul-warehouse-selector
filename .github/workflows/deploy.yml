# Deploy to the VPS. Manual only: this runs when someone clicks "Run workflow",
# never on push, so a broken commit cannot take the running site down with it.
#
# This file only updates the checkout and then calls deploy/deploy.sh. The build
# and the health check live there, in one copy, so the automated deploy and a
# hand-run deploy cannot drift apart. See section 11 of the README.
#
# Requires these repository secrets (Settings, Secrets and variables, Actions):
#   VPS_HOST      hostname or IP of the server
#   VPS_USER      SSH user that owns the checkout
#   VPS_SSH_KEY   the PRIVATE key, whole file including the BEGIN and END lines
#   VPS_APP_DIR   absolute path of the checkout on the server, e.g. /opt/simpul
#   VPS_PORT      optional, defaults to 22
#
# No credential appears in this file or in its logs. The key is passed to ssh
# through the environment rather than interpolated into the script, so it cannot
# leak into a log line even if a step fails.
#
# This uses the system ssh binary rather than a marketplace SSH action, so the
# deploy key is only ever handed to OpenSSH and never to third-party code.

name: Deploy

on:
  workflow_dispatch:

concurrency:
  # Two deploys at once would race on the same checkout.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same gate as a pull request would get. Deploying a commit whose
      # tests fail is the one mistake this workflow exists to prevent.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test before deploying
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # accept-new pins the host key for this run and refuses a changed one
          # on a later run. Store the host key as a secret if you want it pinned
          # across runs as well.
          ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.VPS_APP_DIR }}"

          echo "--- fetching ---"
          git fetch --prune origin
          # origin/HEAD rather than a branch name: this checkout's default branch
          # is master, and hardcoding one here is a deploy that fails on the day
          # the repository is renamed.
          git remote set-head origin --auto >/dev/null
          # --hard discards any edit made on the server, which is the point of a
          # deploy target. It does not touch ignored files, so the delivery log
          # in data/ survives.
          git reset --hard origin/HEAD
          echo "now at $(git rev-parse --short HEAD)"

          # Everything past this line is deploy/deploy.sh, not a copy of it, so
          # this workflow and a person deploying by hand run the same steps.
          bash deploy/deploy.sh
          REMOTE
