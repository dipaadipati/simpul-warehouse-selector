<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Selector</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #dfe3e9;
    --text: #16191d;
    --muted: #667085;
    --accent: #1f6feb;
    --ok-bg: #e7f6ec;  --ok-fg: #136c34;  --ok-line: #a9d9ba;
    --warn-bg: #fdf1e3; --warn-fg: #8a4b06; --warn-line: #f0cfa3;
    --code-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #171b21;
      --border: #2a313b;
      --text: #e7ebf0;
      --muted: #98a2b3;
      --accent: #6aa8ff;
      --ok-bg: #12301d;  --ok-fg: #86e0a5;  --ok-line: #1f5233;
      --warn-bg: #33230f; --warn-fg: #f0c07a; --warn-line: #5a3d18;
      --code-bg: #222831;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 940px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 14px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .lede { color: var(--muted); margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  /* A grid item refuses to shrink below its own min-content width, and the JSON
     in "Decision details" is one unbroken 1950px line, so opening that panel used
     to widen the whole page and give it a horizontal scrollbar. The <pre> already
     has overflow-x: auto; this is what lets it take effect. */
  #result { min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 0 8px 8px 0; }
  td { padding: 7px 8px 7px 0; border-top: 1px solid var(--border); vertical-align: middle; }
  td.num, th.num { text-align: right; padding-right: 0; }
  input[type=number] {
    width: 84px; padding: 7px 9px; text-align: right; font: inherit;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 7px;
  }
  select { padding: 7px 9px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; }
  input[type=number]:focus-visible, button:focus-visible, select:focus-visible, label.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .tag.cold { border-color: var(--accent); color: var(--accent); }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  label.opt { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
  label.opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  label.opt b { display: block; font-size: 14px; }
  label.opt span { color: var(--muted); font-size: 13px; }
  input[type=radio] { margin-top: 3px; accent-color: var(--accent); }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  button { font: inherit; font-weight: 600; padding: 9px 17px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:disabled { opacity: 0.55; cursor: progress; }
  .verdict { display: flex; gap: 10px; align-items: baseline; padding: 13px 15px; border-radius: 10px; border: 1px solid; margin-bottom: 16px; }
  .verdict.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-fg); }
  .verdict.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-fg); }
  .verdict b { font-size: 15px; }
  .metrics { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 18px; }
  .metric span { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .metric strong { font-size: 19px; font-weight: 650; }
  .ship { border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; margin-bottom: 10px; }
  .ship h3 { margin: 0 0 3px; font-size: 15px; }
  .ship .meta { color: var(--muted); font-size: 13px; margin-bottom: 9px; }
  .ship ul { margin: 0; padding-left: 18px; }
  ol.steps { margin: 0; padding-left: 20px; }
  ol.steps li { margin-bottom: 9px; }
  table.rej td { font-size: 13.5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--code-bg); padding: 1px 6px; border-radius: 5px; }
  .alt { border-left: 3px solid var(--accent); padding: 3px 0 3px 13px; margin-top: 16px; color: var(--muted); font-size: 13.5px; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { overflow-x: auto; background: var(--code-bg); padding: 14px; border-radius: 9px; font-size: 12.5px; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    body { padding: 20px 16px 48px; }
    td .tag { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="card">
    <h1>Warehouse Selector</h1>
    <p class="lede">Enter an order. The system picks the warehouse or warehouses that should fulfil it and explains why.</p>
  </header>

  <form class="card" id="order-form">
    <h2>Order</h2>
    <table>
      <thead>
        <tr><th>Product</th><th>Category</th><th class="num">Quantity</th></tr>
      </thead>
      <tbody id="product-rows"></tbody>
    </table>

    <h2 style="margin-top:24px">Cold-chain policy</h2>
    <fieldset id="policy-options">
      <label class="opt">
        <input type="radio" name="policy" value="end-to-end" checked>
        <span><b>End-to-end</b><span>Vaccines need cold storage and a refrigerated van. The cold chain must hold in transit too.</span></span>
      </label>
      <label class="opt">
        <input type="radio" name="policy" value="storage-only">
        <span><b>Storage only</b><span>Vaccines need a warehouse with cold storage. Vehicle type is ignored.</span></span>
      </label>
    </fieldset>

    <section id="objective-block" class="hidden">
      <h2 style="margin-top:24px">Rank by</h2>
      <fieldset id="objective-options">
        <label class="opt">
          <input type="radio" name="objective" value="distance" checked>
          <span><b>Total distance</b><span>The default. Assumes a kilometre costs the same everywhere.</span></span>
        </label>
        <label class="opt">
          <input type="radio" name="objective" value="minutes">
          <span><b>Predicted travel time</b><span>Learned from the delivery history. Measured per warehouse and time of day, and it does not always agree with distance.</span></span>
        </label>
      </fieldset>
      <div class="actions">
        <label for="depart-day" class="lede">Departing</label>
        <select id="depart-day" aria-label="Departure day"><option value="">any time</option></select>
        <select id="depart-hour" aria-label="Departure hour"><option value="">any time</option></select>
        <span id="depart-hint" class="lede"></span>
      </div>
    </section>

    <div class="actions">
      <button type="submit" class="primary" id="submit">Find warehouse</button>
      <button type="button" id="example">Fill example order</button>
      <button type="button" id="clear">Clear</button>
      <!-- role="status" rather than a bare span: this is the only validation
           message the product has, and without it a screen reader never hears
           that the submit was refused. #result is announced for the same reason. -->
      <span id="status" class="lede" role="status"></span>
    </div>
  </form>

  <section id="result" class="card hidden" aria-live="polite"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let catalog = null;

const el = (tag, props = {}, ...kids) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
};

async function loadCatalog() {
  catalog = await (await fetch("/api/catalog")).json();
  const rows = $("product-rows");  rows.replaceChildren(
    ...catalog.products.map((p) =>
      el("tr", {},
        el("td", {},
          el("div", {}, el("span", { className: "pid", textContent: p.id + "  " }), p.name),
          el("span", { className: "tag" + (p.coldChain ? " cold" : ""), textContent: p.coldChain ? "cold chain" : "ambient" }),
        ),
        el("td", { className: "lede", textContent: p.category }),
        el("td", { className: "num" },
          el("input", { type: "number", min: "0", step: "1", placeholder: "0", value: "", id: "qty-" + p.id, "aria-label": "Quantity of " + p.name }),
        ),
      ),
    ),
  );

  // The travel-time objective only makes sense where the delivery log is
  // deployed, and it is not part of the repository, so the control is hidden
  // rather than offered and then refused.
  if (catalog.travelObjectiveAvailable) {
    $("objective-block").classList.remove("hidden");
    $("depart-day").append(...catalog.days.map((day) => el("option", { value: day, textContent: day })));
    $("depart-hour").append(
      ...Array.from({ length: 24 }, (_, hour) =>
        el("option", { value: String(hour), textContent: String(hour).padStart(2, "0") + ":00" }),
      ),
    );
  }
}

/** Both selects, or neither: a day without an hour is not a departure time. */
function readDeparture() {
  const day = $("depart-day").value;
  const hour = $("depart-hour").value;
  return day && hour !== "" ? { day, hour: Number(hour) } : undefined;
}

/**
 * The API takes a departure as one value, {day, hour}, or not at all. Two
 * independent selects invited the reader to set a day and leave the hour on
 * "any time", and the day was then dropped without a word - the answer came back
 * unchanged and nothing on screen said why. Keeping the pair both-or-neither
 * makes that state unreachable instead of merely documented.
 */
function syncDeparture() {
  const day = $("depart-day").value;
  const hour = $("depart-hour").value;
  $("depart-hour").disabled = day === "";
  $("depart-day").disabled = hour !== "";
  $("depart-hint").textContent =
    day === ""
      ? 'Leave both on "any time" for the all-day median, or pick a day to add an hour.'
      : hour === ""
        ? "Now pick an hour - a day on its own is not a departure time."
        : 'Set the hour back to "any time" to clear the departure time.';
}

function readOrder() {
  return catalog.products
    .map((p) => ({ productId: p.id, quantity: Number($("qty-" + p.id).value) }))
    .filter((line) => Number.isInteger(line.quantity) && line.quantity > 0);
}

const tag = (text, cls = "") => el("span", { className: "tag " + cls, textContent: text });

function renderResult(result) {
  const box = $("result");
  box.classList.remove("hidden");
  const parts = [];

  parts.push(
    el("div", { className: "verdict " + (result.feasible ? "ok" : "warn") },
      el("b", { textContent: result.feasible ? "Fulfilable" : "Cannot be fulfilled" }),
      el("span", { textContent: result.explanation.summary }),
    ),
  );

  if (result.feasible) {
    const metric = (label, value) => el("div", { className: "metric" }, el("span", { textContent: label }), el("strong", { textContent: value }));
    const distance = metric("Total distance", result.totalDistanceKm + " km");
    // The metric that actually decided the plan leads, so ranking by travel time
    // visibly changes the headline instead of only the prose underneath it.
    const travel = result.estimatedMinutes === undefined ? null : metric("Predicted travel time", result.estimatedMinutes + " min");

    parts.push(
      el("div", { className: "metrics" },
        metric("Shipments", String(result.shipmentCount)),
        ...(travel ? [travel, distance] : [distance]),
        metric("Policy", result.policy.coldChain),
      ),
    );

    for (const a of result.allocations) {
      parts.push(
        el("div", { className: "ship" },
          el("h3", { textContent: a.warehouseId + " - " + a.city }),
          el("div", { className: "meta", textContent: a.distanceKm + " km, " + a.fleet + (a.coldChainCapable ? ", cold-chain capable" : ", no cold storage") }),
          el("ul", {}, a.lines.map((l) => el("li", { textContent: l.qty + " x " + l.productId + " " + l.productName }))),
        ),
      );
    }
  }

  if (result.unfilled.length) {
    parts.push(
      el("h2", { textContent: "Unfilled" }),
      el("table", { className: "rej" },
        el("tbody", {}, result.unfilled.map((u) =>
          el("tr", {},
            el("td", {}, el("code", { textContent: u.productId })),
            el("td", {}, tag(u.code, "cold")),
            el("td", { textContent: "Asked for " + u.qtyRequested + ", short by " + u.qtyShort + " (" + u.qtyAvailable + " available)" }),
          ),
        )),
      ),
    );
  }

  parts.push(el("h2", { textContent: "Why", style: "margin-top:24px" }),
    el("ol", { className: "steps" }, result.explanation.steps.map((s) => el("li", { textContent: s }))));

  // The alternative policy belongs to the reasoning, so it sits directly under
  // the steps it comments on, before the list of warehouses that were passed
  // over. It used to be pushed after that table, which put the same callout in
  // two different places depending on whether the order could be fulfilled.
  if (result.explanation.alternativePolicy) {
    const alt = result.explanation.alternativePolicy;
    parts.push(
      el("div", { className: "alt" },
        el("b", { textContent: alt.sameAsChosen ? "The other policy agrees: " : "The other policy would differ: " }),
        el("span", { textContent: 'under "' + alt.policy + '", ' + alt.summary + "." }),
      ),
    );
  }

  if (result.rejected.length) {
    parts.push(
      el("h2", { textContent: "Warehouses not used", style: "margin-top:24px" }),
      el("table", { className: "rej" },
        el("tbody", {}, result.rejected.map((r) =>
          el("tr", {},
            el("td", {}, el("code", { textContent: r.warehouseId })),
            el("td", {}, tag(r.code)),
            el("td", { textContent: r.reason }),
          ),
        )),
      ),
    );
  }

  const notes = result.explanation.notes || [];
  parts.push(
    el("details", {},
      el("summary", { textContent: "Decision details" }),
      ...(notes.length ? [el("ul", {}, notes.map((n) => el("li", { textContent: n })))] : []),
      el("pre", { textContent: JSON.stringify(result, null, 2) }),
    ),
  );

  box.replaceChildren(...parts);
  box.scrollIntoView({ block: "start" });
}

/**
 * Changing the policy, the ranking, or the departure time changes the answer, so
 * re-run rather than leaving a result on screen that was produced by the
 * settings the reader has just replaced. A stale answer next to a fresh radio
 * button is the one way this page can mislead.
 */
function inputsChanged() {
  // Any complaint still sitting in #status was about the value that has just
  // been replaced, so it goes with it. Without this the message outlives the
  // mistake it describes and survives Clear as well.
  if (!$("submit").disabled) $("status").textContent = "";
  if (!$("result").classList.contains("hidden") && !$("submit").disabled) $("order-form").requestSubmit();
}
$("order-form").addEventListener("change", () => {
  syncDeparture();
  inputsChanged();
});

// The complaint goes as soon as the reader starts fixing the input it names. The
// re-run above still waits for the value to settle: a request per keystroke
// would be a lot of latency to spend on an intermediate number.
$("order-form").addEventListener("input", () => {
  if (!$("submit").disabled) $("status").textContent = "";
});

$("order-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const items = readOrder();
  if (!items.length) {
    $("status").textContent = "Enter a quantity for at least one product.";
    $("result").classList.add("hidden");
    return;
  }
  const policy = new FormData(event.currentTarget).get("policy") || catalog.defaultPolicy;
  const payload = { items, policy };
  if (!$("objective-block").classList.contains("hidden")) {
    payload.objective = new FormData(event.currentTarget).get("objective") || "distance";
    const departAt = readDeparture();
    if (departAt) payload.departAt = departAt;
  }
  $("submit").disabled = true;
  $("status").textContent = "Working...";
  try {
    const response = await fetch("/api/orders", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await response.json();
    $("status").textContent = "";
    if (!response.ok) {
      $("result").classList.remove("hidden");
      $("result").replaceChildren(el("div", { className: "verdict warn" }, el("b", { textContent: "Rejected" }),
        el("span", { textContent: (body.problems || [body.error]).join("; ") })));
      return;
    }
    renderResult(body);
  } catch (error) {
    $("status").textContent = "Request failed: " + error.message;
  } finally {
    $("submit").disabled = false;
  }
});

$("example").addEventListener("click", () => {
  const example = { P001: 10, P002: 45, P003: 0, P004: 0, P005: 20 };
  for (const [id, qty] of Object.entries(example)) $("qty-" + id).value = qty ? String(qty) : "";
  // Writing .value fires no change event, so this button used to leave the
  // previous answer on screen next to a form that no longer produces it.
  inputsChanged();
});

$("clear").addEventListener("click", () => {
  for (const p of catalog.products) $("qty-" + p.id).value = "";
  // The departure is part of the order, so it goes with it. Leaving it set meant
  // Clear emptied the quantities and then the *next* order quietly carried a time
  // the reader believed they had cleared - 74 minutes instead of 33 - and the day
  // was locked behind the hour, so the way back was to read the hint and work out
  // which of the pair to unset first. Writing .value fires no change event, so the
  // re-run does not happen here and does not need to: no result is on screen.
  $("depart-day").value = "";
  $("depart-hour").value = "";
  syncDeparture();
  $("result").classList.add("hidden");
  $("status").textContent = "";
});

syncDeparture();
loadCatalog().catch((error) => { $("status").textContent = "Could not load catalog: " + error.message; });
</script>
</body>
</html>
