# Reverse proxy for the warehouse selection service.
#
# The app listens on 127.0.0.1:3000 and is not exposed directly; this file is the
# only public entry point. Replace SERVER_NAME with the real hostname, then
# obtain a certificate with `certbot --nginx -d SERVER_NAME` and it will fill in
# the TLS lines for you.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Proxy rather than redirect so the service is reachable before a certificate
    # exists. certbot --nginx rewrites this block once TLS is in place; if you
    # would rather redirect immediately, replace the location block below with
    #   return 301 https://$host$request_uri;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The app reads neither of these, but a reverse proxy that does not set
        # them makes every future log line useless.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # The API caps request bodies at 64 KiB and answers a larger one with a 400.
    # Keep nginx's own limit above that so the app produces the error rather than
    # nginx producing a generic 413.
    client_max_body_size 256k;

    access_log /var/log/nginx/simpul-access.log;
    error_log  /var/log/nginx/simpul-error.log;
}
